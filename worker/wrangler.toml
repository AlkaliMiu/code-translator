name = "code-translator-api"
main = "src/index.ts"
compatibility_date = "2026-09-29"

[vars]
# Comma-separated, never *. Replace with your Pages domain and any custom domain.
ALLOWED_ORIGINS = "http://localhost:5173,https://YOUR_NAME.github.io"
OPENAI_MODEL = "gpt-4o-mini"

# Set the API key with `pnpm exec wrangler secret put OPENAI_API_KEY`; never store it in this file.
