<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Translator · Turn unfamiliar code into a step-by-step lesson</title>
    <meta name="description" content="Paste Python, JavaScript, or TypeScript and get a plain-language, step-by-step explanation linked to the code. Available in English, 中文, Français, Deutsch, Español, 日本語 and Русский." />
    <meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141618" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Code Translator" />
    <meta property="og:description" content="Turn unfamiliar code into a step-by-step lesson, in seven languages." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%229%22 fill=%22%231f6f5c%22/><path d=%22M11.5 10.5 6.5 16l5 5.5M20.5 10.5l5 5.5-5 5.5M14.5 21.5h3%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222.4%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>" />
    <script>
      // Apply the saved theme before first paint to avoid a light flash in dark mode.
      try {
        var theme = localStorage.getItem('code-translator-theme')
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Code Translator needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
